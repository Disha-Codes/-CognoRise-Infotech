<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CURRENCY CONVERTER</title>

    <link rel="stylesheet" href="style.css"/>

    <!--Font Awsome icon cnd-->

    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" 
    />
</head>

<body>
    <div class="converter-box">
        <h1>CURRENCY CONVERTER</h1>
        <!--form-->
        <form action="#" class="form">
            <!--form field-->
            <div class="form-field">
                <div class="info">
                    <img src="https://flagsapi.com/IN/shiny/64.png">

                    <select id="from"></select>
                </div>

                <div class="amount">
                    <input type="number" placeholder="0"/>
                </div>
            </div>    

            <!--icon-->
            <div class="icon">
                <i class="fa-solid fa-right-left" onclick="exchange()"></i>
            </div>

            <!--form field-->
            <div class="form-field">
                <div class="info">
                    <img src="https://flagsapi.com/JP/shiny/64.png">

                    <select id="to"></select>
                </div>

                <div class="result">0</div>
            </div> 

            <!--buttons-->
            <div class="buttons">
                <button type="button" class="clear" onclick="clearData()">clear</button>
                <button type="button" class="convert" onclick="getRate()">convert</button>
            </div>

        </form>

    </div>
    <script src="countries.js"></script>
    <script src="script.js"></script>
</body>

</html>
